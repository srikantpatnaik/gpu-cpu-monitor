name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libssl-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}
        env:
          OPENSSL_DIR: /usr

      - name: Create release assets
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/gpu-cpu-monitor release/gpu-cpu-monitor-${{ matrix.arch }}-linux
          cd release && tar -czf gpu-cpu-monitor-${{ matrix.arch }}-linux.tar.gz gpu-cpu-monitor-${{ matrix.arch }}-linux
        env:
          OPENSSL_DIR: /usr

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: release/gpu-cpu-monitor-${{ matrix.arch }}-linux.tar.gz
          asset_name: gpu-cpu-monitor-${{ matrix.arch }}-linux.tar.gz
          asset_content_type: application/gzip